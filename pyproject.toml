[project]
name = "agentic-due-diligence"
version = "0.1.0"
description = "Multi-agent due diligence analyst — Research Agent starter"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
due-diligence = "src.main:main"
